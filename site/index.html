<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14061f">
<title>Virtual Nicki Night — Style Studio</title>
<style>
:root{--bg:#14061f;--card:#22102f;--card2:#2c1640;--line:#43245e;--pink:#ff2f9e;--pink2:#ff6cc0;--txt:#fff4fb;--dim:#b79bc9;--gold:#ffd35a;--r:18px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:16px/1.35 -apple-system,BlinkMacSystemFont,"SF Pro Rounded","Segoe UI",Roboto,sans-serif}
body{display:flex;flex-direction:column;background:radial-gradient(1200px 600px at 20% -10%,#4b1362 0,transparent 60%),radial-gradient(900px 500px at 100% 100%,#6a0f47 0,transparent 55%),var(--bg)}
#top{padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;border-bottom:1px solid var(--line);background:#14061fcc;backdrop-filter:blur(8px)}
#top h1{margin:0;font-size:19px;letter-spacing:.4px}#top h1 b{color:var(--pink)}
#who{display:flex;gap:8px;margin-left:auto;align-items:center;flex-wrap:wrap}
#who input[type=text]{width:160px}#who select{width:92px}
body.mod #who,body.mod #top h1{display:none}body.mod #top{display:none}
input[type=text],select{background:#180a25;border:1px solid var(--line);color:var(--txt);border-radius:12px;padding:10px 12px;font-size:16px;min-height:44px;font-family:inherit}
input:focus,select:focus{outline:2px solid var(--pink)}
.btn{border:1px solid var(--line);background:var(--card2);color:var(--txt);border-radius:14px;padding:10px 14px;font-size:15px;font-weight:650;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
.btn:active{transform:scale(.97)}.btn.go{background:linear-gradient(135deg,#ff2f9e,#c2188a);border-color:#ff6cc0;box-shadow:0 4px 18px #ff2f9e55}.btn.on{background:linear-gradient(135deg,#7a2bd6,#ff2f9e);border-color:#ff8fd0}
#app{flex:1;display:grid;grid-template-columns:minmax(300px,42%) 1fr;gap:14px;padding:14px;min-height:0}
#stage{position:relative;border-radius:24px;background:radial-gradient(500px 360px at 50% 30%,#5a1a78 0,#2a0f3f 55%,#190a28 100%);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:flex-end;overflow:hidden;min-height:340px}
#stage:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 20% 15%,#ff2f9e40 0,transparent 25%),radial-gradient(circle at 85% 25%,#4a8bff33 0,transparent 25%);pointer-events:none}
#ped{position:absolute;bottom:34px;left:50%;transform:translateX(-50%);width:62%;height:38px;border-radius:50%;background:radial-gradient(closest-side,#ff2f9ecc,#ff2f9e22 70%,transparent);filter:blur(1px)}
#ring{position:absolute;bottom:40px;left:50%;transform:translateX(-50%);width:58%;height:26px;border-radius:50%;border:2px solid #ff8fd0;box-shadow:0 0 18px #ff2f9e,inset 0 0 14px #ff2f9e88}
#fig{position:relative;z-index:2;display:flex;align-items:flex-end;justify-content:center;height:100%;width:100%;padding:56px 0 40px}#fig canvas{height:100%;width:auto;max-width:100%}
#boot{position:fixed;inset:0;z-index:50;background:#14061f;display:flex;align-items:center;justify-content:center;font-weight:700;color:#ff6cc0;font-size:18px;transition:opacity .4s}#boot.off{opacity:0;pointer-events:none}
#stbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:8px;z-index:3;flex-wrap:wrap}
#note{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-size:12px;color:var(--dim);z-index:3}
#lockmsg{position:absolute;bottom:30px;left:12px;right:12px;z-index:4;background:#000b;border:1px solid var(--gold);color:var(--gold);padding:10px 12px;border-radius:14px;font-size:14px;font-weight:600;display:none;text-align:center}
#panel{display:flex;flex-direction:column;min-height:0;background:#1a0b27cc;border:1px solid var(--line);border-radius:24px;overflow:hidden}
#cats{display:flex;gap:6px;padding:10px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}#cats::-webkit-scrollbar{display:none}
#cats button{flex:0 0 auto;border:0;background:var(--card);color:var(--dim);padding:10px 14px;border-radius:99px;font-size:15px;font-weight:700;min-height:44px;display:flex;align-items:center;gap:7px}
#cats button.on{background:linear-gradient(135deg,#7a2bd6,#ff2f9e);color:#fff;box-shadow:0 0 16px #ff2f9e66}
#opts{flex:1;overflow:auto;padding:12px;-webkit-overflow-scrolling:touch}
.sub{font-size:12px;text-transform:uppercase;letter-spacing:1.2px;color:var(--pink2);margin:14px 2px 8px;font-weight:700}.sub:first-child{margin-top:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(112px,1fr));gap:10px}
.opt{position:relative;border:2px solid transparent;background:var(--card);border-radius:16px;padding:6px 6px 8px;text-align:center;cursor:pointer;color:var(--txt);font:inherit;display:flex;flex-direction:column;align-items:center;gap:4px}
.opt:active{transform:scale(.97)}.opt.on{border-color:var(--pink2);background:#3a1650;box-shadow:0 0 16px #ff2f9e66}
.opt .th{height:104px;display:flex;align-items:flex-end;justify-content:center;width:100%;overflow:hidden;border-radius:12px;background:linear-gradient(180deg,#2e1642,#1f0d2e)}.opt .th img{max-height:100%;max-width:100%;display:block}.opt .th.ld{background:linear-gradient(110deg,#2e1642 30%,#3d1d57 50%,#2e1642 70%);background-size:200% 100%;animation:ld 1.2s infinite}@keyframes ld{to{background-position:-200% 0}}
.opt .nm{font-size:13px;font-weight:700;line-height:1.1}
.badge{position:absolute;top:6px;right:6px;font-size:11px;font-weight:800;padding:3px 7px;border-radius:99px;background:#000c;border:1px solid var(--gold);color:var(--gold);z-index:2}
.badge.vip{border-color:#b98cff;color:#d9bcff}
.opt.locked .th{box-shadow:inset 0 0 0 1px #ffd35a55}
.opt.locked:after{content:"";position:absolute;inset:0;border-radius:16px;background:linear-gradient(115deg,transparent 40%,#ffd35a22 50%,transparent 60%);background-size:250% 100%;animation:shine 3.2s infinite;pointer-events:none}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-50% 0}}
.sw{display:flex;gap:8px;flex-wrap:wrap}.sw button{width:46px;height:46px;border-radius:50%;border:3px solid #ffffff22;padding:0;position:relative}.sw button.on{border-color:#fff;box-shadow:0 0 14px #fff8}.sw button.none{background:repeating-linear-gradient(45deg,#444 0 6px,#222 6px 12px)}
.swn{font-size:11px;color:var(--dim);margin-top:6px}
.seg{display:flex;gap:8px;flex-wrap:wrap}.seg .btn{flex:1;justify-content:center;min-width:90px}
#bar{padding:10px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:#10051af0;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
#cmd{flex:1;min-width:220px;font:600 15px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;background:#0b0412;border:1px solid var(--line);border-radius:12px;padding:11px 12px;color:#ffd1ea;word-break:break-word;max-height:76px;overflow:auto}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:96px;background:#000d;border:1px solid var(--pink);padding:10px 16px;border-radius:99px;font-weight:700;opacity:0;transition:opacity .2s;pointer-events:none;z-index:30}#toast.on{opacity:1}
#how{font-size:12px;color:var(--dim);padding:0 14px 10px;text-align:center}
@media (max-width:820px){#app{grid-template-columns:1fr;grid-template-rows:auto 1fr;padding:10px;gap:10px;overflow:hidden}#stage{min-height:0;height:36vh}.grid{grid-template-columns:repeat(auto-fill,minmax(96px,1fr))}.opt .th{height:88px}#who input[type=text]{width:130px}}
</style></head><body>

<div id="top"><h1>STYLE <b>STUDIO</b></h1><div id="who"><input type="text" id="h" placeholder="@your handle (optional)" autocapitalize="off" autocorrect="off"><select id="pl"><option value="x">X</option><option value="tiktok">TikTok</option><option value="kick">Kick</option></select></div></div>
<div id="app">
 <div id="stage"><div id="stbar"><button class="btn sm" id="dnc">Dancing</button><button class="btn sm" id="rnd">🎲 Surprise me</button><button class="btn sm" id="rst">Reset</button></div><div id="lockmsg"></div><div id="ped"></div><div id="ring"></div><div id="fig"></div><div id="note"></div></div>
 <div id="panel"><div id="cats"></div><div id="opts"></div></div>
</div>
<div id="how"></div>
<div id="bar"><div id="cmd"></div><button class="btn go" id="copy">Copy command</button><button class="btn" id="copyd">Copy !dance</button></div>

<script>(function(){var t=Date.now();document.write('<script src="vnn/rig8.js?t='+t+'"><\/script><script src="vnn/vnn-avatar.js?t='+t+'"><\/script>');})();</script>
<script>
(function () {
  /* ================= Style Studio (layered avatars) ================= */
  var CAT = VNNA.CATALOG, byId = VNNA.byId;
  function $(id) { return document.getElementById(id); }
  var Q = new URLSearchParams(location.search), MOD = Q.get('mod') === '1', LIBN = Q.get('lib') || 'mid';
  if (MOD) document.body.classList.add('mod');
  var LOOKS = CAT.looks.filter(function (l) { return l.unlock !== 'nicki'; });
  var CLR = CAT.colors.clothing.filter(function (c) { return !c.hidden; }), HC = CAT.hair.colors.filter(function (c) { return !c.hidden; }), AC = CAT.accessories.colors;
  var ITEMS = CAT.accessories.items.filter(function (a) { return !a.hidden; });
  function fresh() { return { top: 'tee', topColor: 'pink', bottom: 'jeans', bottomColor: null, shoes: 'sneakers', shoesColor: null, height: 'regular', body: 'straight', skin: 'caramel', hair: 'long', hairColor: 'brown', acc: [], accColor: 'gold', dance: 'groove' }; }
  var sel = fresh(), photoImg = null, photoURL = null, handle = '', plat = 'x', cat = 'tops', danceOn = !(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);
  var RING = { x: '#1d9bf0', tiktok: '#fe2c55', kick: '#53fc18' };
  function hash(s) { var h = 7; for (var i = 0; i < s.length; i++) h = (h * 31 + s.charCodeAt(i)) >>> 0; return h; }

  /* ----- head (profile pic or placeholder) ----- */
  function headFn(ctx, x, y, a, r) {
    ctx.save(); ctx.translate(x, y); ctx.rotate(a);
    ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.save(); ctx.clip();
    if (photoImg && photoImg.complete && photoImg.naturalWidth) { var s = Math.max(2 * r / photoImg.naturalWidth, 2 * r / photoImg.naturalHeight); ctx.drawImage(photoImg, -photoImg.naturalWidth * s / 2, -photoImg.naturalHeight * s / 2, photoImg.naturalWidth * s, photoImg.naturalHeight * s); }
    else {
      var g = ctx.createRadialGradient(-r * 0.3, -r * 0.35, r * 0.1, 0, 0, r); g.addColorStop(0, '#ffb6d9'); g.addColorStop(1, '#b0307a'); ctx.fillStyle = g; ctx.fillRect(-r, -r, 2 * r, 2 * r);
      ctx.fillStyle = 'rgba(255,255,255,.55)'; ctx.beginPath(); ctx.arc(0, -r * 0.18, r * 0.3, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(0, r * 0.78, r * 0.55, r * 0.4, 0, 0, 7); ctx.fill();
    }
    ctx.restore(); ctx.lineWidth = r * 0.07; ctx.strokeStyle = RING[plat] || '#ffffff'; ctx.beginPath(); ctx.arc(0, 0, r, 0, 7); ctx.stroke(); ctx.restore();
  }

  /* ----- stage ----- */
  var cvs = document.createElement('canvas'); cvs.width = 460; cvs.height = 840; $('fig').appendChild(cvs);
  var cx = cvs.getContext('2d'), cur = null, tok = 0, t0 = performance.now(), frozen = 1.0;
  function rebuild() { var my = ++tok; VNNA.build(sel).then(function (r) { if (my === tok) { cur = r; } }); }
  function frame(now) {
    if (cur) {
      cx.clearRect(0, 0, cvs.width, cvs.height);
      var s = 840 / 2010, t = danceOn ? (now - t0) / 1000 : frozen;
      VNNA.draw(cx, cur.set, cur.spec, { x: 230, y: 2005 * s, h: 1700 * s * cur.spec.hs, clip: VNNA.clipOf(sel.dance), t: t, beat: 0.5, ph: 0, amp: 1, head: headFn });
    }
    requestAnimationFrame(frame);
  }

  /* ----- thumbnails ----- */
  var TH = {}, OFF = document.createElement('canvas'); OFF.width = 300; OFF.height = 600; var ox = OFF.getContext('2d');
  var REG = { head: [50, 60, 200, 185], torso: [50, 165, 200, 185], mid: [40, 215, 220, 204], legs: [20, 350, 260, 240], feet: [65, 432, 170, 158], full: [0, 0, 300, 600] };
  function thumbKey(S, region) { return region + '|' + [S.top, S.topColor, S.bottom, S.bottomColor, S.shoes, S.shoesColor, S.skin, S.hair, S.hairColor, S.body, S.height, S.acc.join(','), S.accColor].join(','); }
  function thumb(S, region) {
    var key = thumbKey(S, region); if (TH[key]) return Promise.resolve(TH[key]);
    return VNNA.build(S).then(function (r) {
      ox.clearRect(0, 0, 300, 600); VNNA.draw(ox, r.set, r.spec, { x: 150, y: 590, h: 540 * r.spec.hs, clip: 'idle', t: 0.9, beat: 0.5, head: headFn });
      var g = REG[region], c = document.createElement('canvas'); c.width = 168; c.height = region === 'full' ? 156 : Math.round(168 * g[3] / g[2]); var x = c.getContext('2d'); x.imageSmoothingQuality = 'high';
      if (region === 'full') x.drawImage(OFF, 0, 40, 300, 560, 54, 0, 60, 156); else x.drawImage(OFF, g[0], g[1], g[2], g[3], 0, 0, c.width, c.height);
      return TH[key] = c.toDataURL('image/png');
    });
  }
  var thQ = Promise.resolve(), thTok = 0;
  function fillThumbs() {
    var my = ++thTok;
    Array.prototype.forEach.call($('opts').querySelectorAll('[data-th]'), function (el) {
      var d = JSON.parse(el.getAttribute('data-th')), S = Object.assign({}, sel, d.patch, { acc: d.patch.acc || sel.acc });
      thQ = thQ.then(function () { if (my !== thTok) return; return thumb(S, d.region).then(function (u) { if (my === thTok && el.isConnected) { el.classList.remove('ld'); el.innerHTML = '<img src="' + u + '" alt="">'; } }); }).catch(function () {});
    });
  }
  var UNL = { earned: ['🔒 Earn it', ''], vip: ['👑 VIP', 'vip'] };
  function opt(id, name, patch, region, locked, on) {
    return '<button class="opt' + (on ? ' on' : '') + (locked ? ' locked' : '') + '" data-id="' + id + '">' + (locked ? '<span class="badge ' + UNL[locked][1] + '">' + UNL[locked][0] + '</span>' : '') + '<div class="th ld" data-th=\'' + JSON.stringify({ patch: patch, region: region }) + '\'></div><div class="nm">' + name + '</div></button>';
  }
  function swatches(list, cur, key, noneLabel) {
    return '<div class="sw">' + (noneLabel ? '<button class="none ' + (!cur ? 'on' : '') + '" data-sw="' + key + '" data-id="" title="Original"></button>' : '') + list.map(function (c) { var bg = c.ombre ? 'linear-gradient(135deg,' + c.ombre.join(',') + ')' : c.hex; return '<button class="' + (cur === c.id ? 'on' : '') + '" data-sw="' + key + '" data-id="' + c.id + '" title="' + (c.name || c.id) + '" style="background:' + bg + '"></button>'; }).join('') + '</div>';
  }
  var CATS = [['tops', '👚', 'Tops'], ['bottoms', '👖', 'Bottoms'], ['shoes', '👟', 'Shoes'], ['hair', '💇', 'Hair'], ['acc', '✨', 'Extras'], ['skin', '🎨', 'Skin'], ['body', '📏', 'Size & shape'], ['dance', '🕺', 'Dance']];
  function renderCats() { $('cats').innerHTML = CATS.map(function (c) { return '<button data-c="' + c[0] + '" class="' + (cat === c[0] ? 'on' : '') + '">' + c[1] + ' ' + c[2] + '</button>'; }).join(''); }
  function regionFor(a) { return a.slot === 'neck' ? 'torso' : (a.slot === 'waist' ? 'mid' : (a.slot === 'carry' ? 'mid' : (a.slot === 'face' || a.slot === 'head' || a.slot === 'ears' ? 'head' : 'mid'))); }
  function accPatch(a) { var p = { acc: [a.id], accColor: sel.accColor || 'gold' }; if (a.slot === 'hands' || a.slot === 'wrist' || a.slot === 'arm' || a.slot === 'carry' || a.slot === 'waist') p.top = 'tank'; return p; }
  function renderOpts() {
    var h = '', o = $('opts'), sc = o.scrollTop;
    if (cat === 'tops') {
      var fr = LOOKS.filter(function (l) { return l.unlock === 'free'; }), lk = LOOKS.filter(function (l) { return l.unlock !== 'free'; });
      h += '<div class="sub">Everyday fits</div><div class="grid">' + fr.map(function (l) { return opt(l.id, l.name, { top: l.id }, 'torso', null, sel.top === l.id); }).join('') + '</div>';
      h += '<div class="sub">Unlockable (preview them now, earn them in the club)</div><div class="grid">' + lk.map(function (l) { return opt(l.id, l.name, { top: l.id }, l.dress ? 'full' : 'torso', l.unlock, sel.top === l.id); }).join('') + '</div>';
      h += '<div class="sub">Top color (plain tops and dresses)</div>' + swatches(CLR, sel.topColor, 'topColor', true);
    } else if (cat === 'bottoms') {
      h += '<div class="grid">' + CAT.bottoms.map(function (b) { return opt(b.id, b.name, { bottom: b.id, top: 'tank', topColor: 'white' }, 'legs', b.unlock === 'earned' ? 'earned' : null, sel.bottom === b.id); }).join('') + '</div><div class="sub">Bottom color</div>' + swatches(CLR, sel.bottomColor, 'bottomColor', true);
    } else if (cat === 'shoes') {
      h += '<div class="grid">' + CAT.shoes.map(function (s) { return opt(s.id, s.name, { shoes: s.id }, s.shaft ? 'legs' : 'feet', null, sel.shoes === s.id); }).join('') + '</div><div class="sub">Shoe color</div>' + swatches(CLR, sel.shoesColor, 'shoesColor', true);
    } else if (cat === 'hair') {
      h += '<div class="sub">Style</div><div class="grid"><button class="opt' + (!sel.hair ? ' on' : '') + '" data-id=""><div class="th ld" data-th=\'' + JSON.stringify({ patch: { hair: null, hairColor: null }, region: 'head' }) + '\'></div><div class="nm">No hair</div></button>' + CAT.hair.styles.map(function (s) { return opt(s.id, s.name, { hair: s.id }, 'head', null, sel.hair === s.id); }).join('') + '</div><div class="sub">Hair color</div>' + swatches(HC, sel.hairColor, 'hairColor', false);
    } else if (cat === 'acc') {
      h += '<div class="sub">Pick any (tap again to remove)</div><div class="grid">' + ITEMS.map(function (a) { var on = sel.acc.indexOf(a.id) >= 0; return opt(a.id, a.name, accPatch(a), regionFor(a), a.unlock === 'vip' ? 'vip' : null, on); }).join('') + '</div><div class="sub">Accessory color</div>' + swatches(AC, sel.accColor, 'accColor', false);
    } else if (cat === 'skin') {
      h += '<div class="sub">Skin tone</div>' + swatches(CAT.skin, sel.skin, 'skin', false) + '<div class="swn">' + (byId(CAT.skin, sel.skin) || {}).name + '</div>';
    } else if (cat === 'body') {
      h += '<div class="sub">Height</div><div class="seg">' + CAT.heights.map(function (x) { return '<button class="btn ' + (sel.height === x.id ? 'on' : '') + '" data-h="' + x.id + '">' + x.label + '</button>'; }).join('') + '</div><div class="sub">Shape</div><div class="seg">' + CAT.bodies.map(function (b) { return '<button class="btn ' + (sel.body === b ? 'on' : '') + '" data-b="' + b + '">' + b.charAt(0).toUpperCase() + b.slice(1) + '</button>'; }).join('') + '</div>';
    } else if (cat === 'dance') {
      h += '<div class="sub">Your move (it plays on the left)</div><div class="seg">' + CAT.dances.map(function (d) { return '<button class="btn ' + (sel.dance === d.id ? 'on' : '') + '" data-d="' + d.id + '">' + d.name + '</button>'; }).join('') + '</div>';
    }
    o.innerHTML = h; o.scrollTop = sc; fillThumbs();
  }
  function cmdText() {
    var p = [], S = sel;
    if (S.top) p.push(S.top); if (S.topColor && !((byId(LOOKS, S.top) || {}).sig)) p.push(S.topColor);
    if (S.bottom && !(byId(LOOKS, S.top) || {}).dress) { p.push(S.bottom); if (S.bottomColor) p.push(S.bottomColor); }
    if (S.shoes) { p.push(S.shoes); if (S.shoesColor) p.push(S.shoesColor); }
    if (S.height !== 'regular') p.push(S.height); if (S.body === 'curvy') p.push('curvy'); p.push(S.skin);
    if (S.hair) { p.push(S.hair); if (S.hairColor) p.push(S.hairColor); }
    S.acc.forEach(function (a) { p.push(a); }); if (S.acc.length && S.accColor) p.push(S.accColor);
    return '!look ' + p.join(' ');
  }
  function lockInfo() {
    var t = byId(LOOKS, sel.top), b = byId(CAT.bottoms, sel.bottom), w = [];
    if (t && t.unlock === 'vip') return '👑 ' + t.name + ' is VIP-list only. Preview it here, but it only works for the VIP list.';
    if (t && t.unlock === 'earned') w.push(t.name); if (b && b.unlock === 'earned' && !(t && t.dress)) w.push(b.name);
    var vipAcc = sel.acc.map(function (id) { return byId(ITEMS, id); }).filter(function (a) { return a && a.unlock === 'vip'; });
    if (vipAcc.length && !w.length) return '👑 ' + vipAcc[0].name + ' is VIP-list only.';
    return w.length ? '🔒 ' + w.join(' + ') + ': you can preview it here, but you have to earn it. Hang out, dance and chat in the club and it unlocks on its own.' : '';
  }
  function paint() {
    rebuild();
    $('cmd').textContent = cmdText(); var l = lockInfo(), m = $('lockmsg'); m.style.display = l ? 'block' : 'none'; m.textContent = l;
    $('how').textContent = MOD ? '' : '1) Type !enter in the live chat  2) Paste this command  3) Come back as often as you like. Looks you have not earned show a lock.';
    $('dnc').className = 'btn sm' + (danceOn ? ' on' : ''); $('dnc').textContent = danceOn ? 'Dancing' : 'Paused';
    $('note').textContent = handle ? '' : 'Tip: add your @ to see your profile pic on your avatar';
    if (MOD && window.parent !== window) { try { parent.postMessage({ vnnLook: { look: cmdText().replace(/^!look\s*/, ''), dance: sel.dance } }, '*'); } catch (e) {} }
  }
  function all() { renderCats(); renderOpts(); paint(); }
  function toast(t) { var e = $('toast'); e.textContent = t; e.className = 'on'; clearTimeout(toast.t); toast.t = setTimeout(function () { e.className = ''; }, 1900); }
  function copy(text) {
    function ok() { toast('Copied! Paste it in chat'); }
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(ok, fb); else fb();
    function fb() { var t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); ok(); } catch (e) { toast('Press and hold to copy'); } t.remove(); }
  }
  $('cats').onclick = function (e) { var b = e.target.closest('button'); if (!b) return; cat = b.dataset.c; renderCats(); renderOpts(); $('opts').scrollTop = 0; };
  $('opts').onclick = function (e) {
    var sw = e.target.closest('[data-sw]'), b = e.target.closest('.opt'), hh = e.target.closest('[data-h]'), bb = e.target.closest('[data-b]'), dd = e.target.closest('[data-d]');
    if (sw) { var k = sw.dataset.sw, v = sw.dataset.id || null; sel[k] = (sel[k] === v && k !== 'skin' && k !== 'hairColor' && k !== 'accColor') ? null : v; if (k === 'hairColor' && v && !sel.hair) sel.hair = 'long'; }
    else if (hh) sel.height = hh.dataset.h; else if (bb) sel.body = bb.dataset.b; else if (dd) sel.dance = dd.dataset.d;
    else if (b) {
      var id = b.dataset.id;
      if (cat === 'tops') sel.top = id; else if (cat === 'bottoms') sel.bottom = id; else if (cat === 'shoes') sel.shoes = id;
      else if (cat === 'hair') { sel.hair = id || null; if (!id) sel.hairColor = null; else if (!sel.hairColor) sel.hairColor = 'brown'; }
      else if (cat === 'acc') { var i = sel.acc.indexOf(id), it = byId(ITEMS, id); if (i >= 0) sel.acc.splice(i, 1); else { sel.acc = sel.acc.filter(function (x) { var o = byId(ITEMS, x); return !(o && it && o.slot === it.slot); }); sel.acc.push(id); } }
    } else return;
    all();
  };
  $('copy').onclick = function () { copy(cmdText()); };
  $('copyd').onclick = function () { copy('!dance ' + sel.dance); };
  $('dnc').onclick = function () { danceOn = !danceOn; frozen = (performance.now() - t0) / 1000; paint(); };
  $('rst').onclick = function () { sel = fresh(); all(); };
  function pk(a) { return a[Math.floor(Math.random() * a.length)]; }
  $('rnd').onclick = function () {
    var free = LOOKS.filter(function (l) { return l.unlock === 'free' && !l.sig; });
    sel.top = pk(free).id; sel.topColor = pk(CLR).id; sel.bottom = pk(CAT.bottoms.filter(function (b) { return b.unlock === 'free'; })).id; sel.bottomColor = Math.random() < .5 ? pk(CLR).id : null;
    sel.shoes = pk(CAT.shoes).id; sel.shoesColor = Math.random() < .5 ? pk(CLR).id : null; sel.skin = pk(CAT.skin).id; sel.hair = pk(CAT.hair.styles).id; sel.hairColor = pk(HC).id;
    sel.acc = Math.random() < .6 ? [pk(ITEMS.filter(function (a) { return !a.unlock; })).id] : []; sel.accColor = pk(AC).id; sel.height = pk(CAT.heights).id; sel.body = pk(['straight', 'curvy']); sel.dance = pk(CAT.dances).id; all();
  };
  /* profile photo */
  function setPhoto(url) { photoURL = url; if (!url) { photoImg = null; return; } var im = new Image(); im.crossOrigin = 'anonymous'; im.onload = function () { photoImg = im; }; im.src = url; }
  function lookup() {
    handle = $('h').value.trim().replace(/^@/, ''); plat = $('pl').value;
    if (!handle) { setPhoto(null); paint(); return; }
    var prov = plat === 'x' ? 'twitter' : (plat === 'tiktok' ? 'tiktok' : null);
    if (!prov) { toast('Kick photos cannot be looked up, so Kick shows initials'); setPhoto(null); paint(); return; }
    var url = 'https://unavatar.io/' + prov + '/' + encodeURIComponent(handle) + '?fallback=false', im = new Image();
    im.crossOrigin = 'anonymous';
    im.onload = function () { photoImg = im; photoURL = url; paint(); toast('Found @' + handle); }; im.onerror = function () { setPhoto(null); paint(); toast('Could not find a photo, so initials are shown'); };
    im.src = url;
  }
  $('h').onchange = lookup; $('pl').onchange = lookup; $('h').onkeydown = function (e) { if (e.key === 'Enter') { this.blur(); } };
  if (Q.get('h')) { $('h').value = Q.get('h'); if (Q.get('p')) $('pl').value = Q.get('p'); lookup(); }
  window.__sty = { sel: function () { return sel; }, set: function (o) { Object.assign(sel, o); all(); }, cmd: cmdText, cat: function (c) { cat = c; all(); }, ready: false };
  VNNA.setCache(36);
  VNNA.init('vnn/lib_' + LIBN + '/', 'vnn/moc.json').then(function () { all(); requestAnimationFrame(frame); $('boot').className = 'off'; window.__sty.ready = true; }).catch(function (e) { $('boot').textContent = 'Could not load the wardrobe: ' + e.message; });
})();
